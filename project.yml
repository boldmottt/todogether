name: Todogether
options:
  bundleIdPrefix: com.todogether
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# 로컬 SPM 패키지 (Packages/ 하위)
packages:
  SharedModels:
    path: Packages/SharedModels
  SpaceFeature:
    path: Packages/SpaceFeature
  TodoFeature:
    path: Packages/TodoFeature
  CalendarFeature:
    path: Packages/CalendarFeature
  TemplateFeature:
    path: Packages/TemplateFeature
  NotificationFeature:
    path: Packages/NotificationFeature
  WidgetFeature:
    path: Packages/WidgetFeature
  RecurringFeature:
    path: Packages/RecurringFeature

targets:
  Todogether:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
    dependencies:
      - package: SharedModels
      - package: SpaceFeature
      - package: TodoFeature
      - package: CalendarFeature
      - package: TemplateFeature
      - package: NotificationFeature
      - package: WidgetFeature
      - package: RecurringFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todogether.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Face ID(앱 잠금)용 권한 설명
        INFOPLIST_KEY_NSFaceIDUsageDescription: "앱 잠금을 해제하는 데 Face ID를 사용합니다."
        # 기본 인터페이스 방향 / 런치스크린은 아래 info에서 처리
        TARGETED_DEVICE_FAMILY: "1"
    # Info.plist 자동 생성 + 딥링크 URL 스킴 등록
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 투두게더
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.todogether.app
            CFBundleURLSchemes:
              - todogether
